# mjolnir — one stack, one VPS. This file still stands alone (`cd mjolnir
# && docker compose up` works unchanged) — D94 additionally lets
# `tun/compose.yaml` `include:` it alongside `stabbur`'s own compose file
# for a combined "one git pull + one docker compose up" across both repos,
# superseding D84's "mjolnir deploys alone" framing now that stabbur needs
# deploying too.
#
# The full stack now exists (hub-builder-operator-console shipped), so this
# is one profile-free `docker compose up -d`: caddy, postgres, hub, builder.
# Set every required var in `.env` first — see .env.example and DEPLOY.md.
# D-H6: OPERATOR_AUTH_TOKEN gates hub's/builder's own operator routes; it is
# NOT optional for a real deploy (Caddy exposes both publicly at /mjolnir/*
# and /builder/*) even though each service's own config loader treats it as
# optional for local/dev ergonomics.
services:
  caddy:
    image: caddy:2-alpine
    container_name: mjolnir-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"        # HTTP/3
    environment:
      # Site address: a hostname in production (auto-HTTPS), ":8080" locally.
      TUN_SITE_ADDRESS: ${TUN_SITE_ADDRESS:?set TUN_SITE_ADDRESS in .env}
      OTA_TOKEN: ${OTA_TOKEN:?set OTA_TOKEN in .env}
      # Where stabbur actually is — see caddy/Caddyfile's own comment on
      # this var for the full set of cases. No default: an unset
      # STABBUR_UPSTREAM must fail loudly, not silently serve a broken
      # /stabbur/* route.
      #
      # Recommended, verified working: STABBUR_UPSTREAM=backend:5056, with
      # this caddy service (below) and stabbur's own `backend` service both
      # joined to the external `tun-shared` network — one `docker network
      # create tun-shared` before bringing either stack up, for the first
      # time only. This is what "two independent `docker compose up`s,
      # configure .env of both" actually resolves to: the two stacks stay
      # fully independent, this one shared network is the only coupling.
      STABBUR_UPSTREAM: ${STABBUR_UPSTREAM:?set STABBUR_UPSTREAM in .env}
    networks:
      - default
      - tun-shared
    extra_hosts:
      # Fallback only — load-bearing solely if STABBUR_UPSTREAM is instead
      # set to host.docker.internal:<published-port> (stabbur run
      # independently, no shared network, reached via its host-published
      # port). Docker Desktop defines this name on its own; plain Linux
      # Docker (this project's actual VPS target) does not, without this
      # entry. Note this path depends on the host's NAT/hairpin routing
      # actually reaching a published port from inside a bridge network,
      # which is not reliable in every environment (confirmed to fail
      # inside at least one nested-Docker sandbox) — prefer tun-shared
      # above unless there's a specific reason not to share a network.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data:/srv:ro                   # served read-only; publishing writes from the host
      - caddy_data:/data                 # TLS certs — LOSING THIS MEANS RE-ISSUING CERTS
      - caddy_config:/config

  postgres:
    image: postgres:17-alpine
    container_name: mjolnir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: mjolnir
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Deliberately NOT published to the host: only sibling containers reach it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mjolnir"]
      interval: 10s
      timeout: 5s
      retries: 5

  # hub-builder-operator-console: hub owns the schema (`card_slots`,
  # `decks`, `publications`, `build_jobs`, `occurrence_shipments`,
  # `pending_occurrences`, `builder_config`, `job_logs`); builder is the
  # only other writer — both point at the same logical database (02-
  # services.md's "separate logical DB per service" is per *ecosystem*
  # service, not split further between these two, which already share
  # everything by design, D-P3). Bind-mounted, not copied into the image —
  # own `Dockerfile`s install deps at build time; source comes from the
  # checkout, not a layer, so `git pull` + restart is enough.
  mjolnir-hub:
    build:
      context: .
      dockerfile: hub/Dockerfile
    container_name: mjolnir-hub
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # `.env` passes through most config as-is (STABBUR_UI_BASE,
    # OPERATOR_AUTH_TOKEN, TUN_PUBLIC_BASE, ALLOW_HTTP, …) — only the
    # container-specific, computed values are overridden below.
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mjolnir:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/postgres
      BUNDLE_PATH: /app/index.android.bundle
      DATA_DIR: /app/data
    volumes:
      - .:/app
      - /app/node_modules
      - /app/hub/node_modules

  mjolnir-builder:
    build:
      context: .
      dockerfile: builder/Dockerfile
    container_name: mjolnir-builder
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mjolnir:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/postgres
      BUNDLE_PATH: /app/index.android.bundle
      DATA_DIR: /app/data
    volumes:
      - .:/app
      - /app/node_modules
      - /app/builder/node_modules
    networks:
      # tun-shared: so STABBUR_BASE_URL can be a plain service name
      # ("backend:5056") instead of a URL that has to work from inside this
      # specific container — this is builder's own outbound fetch to
      # stabbur's API (pullNotes/pullGrammarRules), not a browser-facing
      # link (that's STABBUR_UI_BASE, which stays a public URL through
      # Caddy — see .env.example). Not needed if deployed via tun's
      # `include:` instead (D94), same reasoning as the caddy service above.
      - default
      - tun-shared

  # stabbur joins via tun/compose.yaml's `include:` (D94) when both are
  # deployed together that way, or via the `tun-shared` external network
  # above when run as two fully independent stacks — its own compose.yaml
  # stays independent either way. smia/phonexa joining is still an open
  # question (tun/docs/02-services.md).

networks:
  default: {}
  tun-shared:
    # One-time setup, before bringing either stack up for the first time:
    #   docker network create tun-shared
    # Not needed at all if this stack is deployed via tun/compose.yaml's
    # `include:` (D94) instead — that path already shares one network across
    # both projects. Only required for the "two separate docker compose up
    # stacks" path.
    external: true

volumes:
  # Explicit `name:` (not left to default to "<project>_<key>") so the
  # actual Docker volume is the SAME one regardless of which project
  # references it. Without this, running via `cd mjolnir && docker compose
  # up` creates `mjolnir_postgres_data`, while running the identical file
  # through `tun/compose.yaml`'s `include:` creates a *different* volume,
  # `tun_postgres_data` — confirmed live: every card_slots/decks/
  # publications row silently "disappeared" switching between the two
  # entry points, because they were never in the same volume at all. Same
  # Docker-level cause as D98's networks needing an explicit shared name;
  # unnamed volumes have the identical per-project-prefix problem.
  caddy_data:
    name: mjolnir_caddy_data
  caddy_config:
    name: mjolnir_caddy_config
  postgres_data:
    name: mjolnir_postgres_data
