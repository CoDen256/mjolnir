<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Deck/Card editor</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Decks</h1>
        <button id="new-deck-btn" type="button">+ New deck</button>
      </div>
      <div class="search-box">
        <input id="search-input" type="search" placeholder="Search decks &amp; cards..." />
        <div id="search-results" class="search-results hidden"></div>
      </div>
      <div id="categories"></div>
    </aside>

    <main class="main">
      <section id="deck-view" class="panel hidden">
        <div class="panel-header">
          <h2 id="deck-title"></h2>
          <div>
            <button id="edit-deck-btn" type="button">Edit deck</button>
            <button id="add-occurrence-toggle-btn" type="button">+ Add occurrence</button>
            <button id="new-card-btn" type="button">+ New card</button>
          </div>
        </div>
        <div id="deck-meta" class="deck-meta"></div>

        <div class="view-toggle">
          <button id="view-by-card-btn" type="button" class="active">By card</button>
          <button id="view-by-order-btn" type="button">By order</button>
          <button id="shuffle-btn" type="button" class="hidden">Shuffle</button>
          <select id="sort-select"></select>
        </div>

        <div id="add-occurrence" class="add-occurrence hidden">
          <select id="add-occurrence-card"></select>
          <select id="add-occurrence-letter">
            <option value="N">N (front)</option>
            <option value="E">E (back)</option>
            <option value="A">A (audio)</option>
          </select>
          <button id="add-occurrence-btn" type="button">Add</button>
        </div>

        <ul id="card-list"></ul>

        <div id="order-view" class="hidden">
          <ol id="occurrence-list"></ol>
        </div>
      </section>

      <section id="card-editor" class="panel hidden">
        <div class="panel-header">
          <h2 id="card-editor-title"></h2>
          <div>
            <button id="save-card-btn" type="button">Save</button>
            <button id="delete-card-btn" type="button" class="danger">Delete</button>
          </div>
        </div>
        <div id="card-deck-meta" class="deck-meta"></div>
        <div id="card-error" class="error hidden"></div>
        <div class="field-grid">
          <label>
            N (front)
            <textarea id="field-N"></textarea>
            <div class="preview" id="preview-N"></div>
          </label>
          <label>
            E (back)
            <textarea id="field-E"></textarea>
            <div class="preview" id="preview-E"></div>
          </label>
          <label>
            D (deck title, redundant)
            <textarea id="field-D"></textarea>
          </label>
          <label>
            X (extra/example)
            <textarea id="field-X"></textarea>
            <div class="preview" id="preview-X"></div>
          </label>
          <label>
            A (which side the audio is attached to)
            <select id="field-A">
              <option value="N">N (front)</option>
              <option value="E">E (back)</option>
              <option value="X">X (extra)</option>
            </select>
          </label>
        </div>
      </section>

      <section id="deck-form" class="panel hidden">
        <div class="panel-header">
          <h2 id="deck-form-title">New deck</h2>
          <button id="deck-form-submit-btn" type="button">Create</button>
        </div>
        <div id="deck-form-error" class="error hidden"></div>
        <div class="field-grid">
          <label>Name <input id="df-Name" /></label>
          <label>Title <input id="df-Title" /></label>
          <label>ID <input id="df-ID" type="number" /></label>
          <label>Code <input id="df-Code" /></label>
          <label class="checkbox-label"><input id="df-Enabled" type="checkbox" /> Enabled</label>
          <label>PullCounter <input id="df-PullCounter" type="number" /></label>
          <label>MaxInterval <input id="df-MaxInterval" type="number" /></label>
          <label>AutoTickStreak <input id="df-AutoTickStreak" type="number" /></label>
          <label>AutoHammerCount <input id="df-AutoHammerCount" type="number" /></label>
          <label>Counter1 <input id="df-Counter1" /></label>
          <label>Counter2 <input id="df-Counter2" /></label>
          <label class="full-width">
            Description
            <textarea id="df-Description"></textarea>
          </label>
        </div>
      </section>

      <p id="empty-state" class="empty-state">Select a deck from the left.</p>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
